# Nginx site config for nangalkotbazar.com — reference copy of what runs on the VPS at
# /etc/nginx/sites-available/nangalkotbazar. Deploys do NOT apply this file; to change the
# live config, edit it on the server (or scp this over) then `nginx -t && systemctl reload nginx`.
#
# The `listen 443 ssl` / ssl_certificate lines and the port-80 redirect block are managed by
# Certbot — leave them alone; `certbot renew` rewrites them.

server {
    server_name nangalkotbazar.com www.nangalkotbazar.com;

    # Profile photo / gallery uploads go through multer -> Cloudinary
    client_max_body_size 15M;

    # Gzip text responses (Next.js already compresses its own, this covers API JSON)
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript text/plain image/svg+xml;
    gzip_min_length 1024;

    # ---- API -> Express (keeps the /api prefix; no trailing slash on proxy_pass) ----
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bulk ID-card PDF rendering spawns python per member and can run long
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering     off;
    }

    # ---- Locally stored uploads (notice PDFs) -> Express ----
    # These are written to backend/uploads and served by express.static at /uploads/*.
    # Without this they fall through to Next.js below and 404.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- Everything else -> Next.js ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Long-cache Next.js immutable build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nangalkotbazar.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nangalkotbazar.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.nangalkotbazar.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nangalkotbazar.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name nangalkotbazar.com www.nangalkotbazar.com;
    return 404; # managed by Certbot




}